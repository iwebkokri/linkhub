# fail2ban reads the Nginx log and firewalls addresses that keep misbehaving.
#   sudo apt install fail2ban
#
# 1) Save the [Definition] block below as  /etc/fail2ban/filter.d/linkhub-auth.conf
# 2) Save the jails below as               /etc/fail2ban/jail.d/linkhub.local
# 3) sudo systemctl restart fail2ban && sudo fail2ban-client status
#
# (If you use Cloudflare, configure Nginx's real_ip first - see nginx.conf - or you would ban Cloudflare itself.)

# ------------------------------- /etc/fail2ban/filter.d/linkhub-auth.conf -------------------------------
# [Definition]
# failregex = ^<HOST> -.*"POST /api/auth/(login|2fa/verify) HTTP/[\d.]+" (401|429)
# ignoreregex =

# ------------------------------- /etc/fail2ban/jail.d/linkhub.local -------------------------------------
# [DEFAULT]
# bantime.increment = true          ; repeat offenders are banned for longer each time
# bantime.factor    = 2
#
# [linkhub-auth]                    ; repeated failed sign-ins / 2FA codes
# enabled  = true
# port     = http,https
# filter   = linkhub-auth
# logpath  = /var/log/nginx/access.log
# maxretry = 8
# findtime = 10m
# bantime  = 1h
#
# [nginx-limit-req]                 ; addresses that keep hitting the Nginx rate limits (a flood from one machine)
# enabled  = true
# port     = http,https
# logpath  = /var/log/nginx/error.log
# maxretry = 20
# findtime = 2m
# bantime  = 30m
#
# [sshd]
# enabled  = true
# maxretry = 4
# bantime  = 1h
