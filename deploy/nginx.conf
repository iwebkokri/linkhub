# /etc/nginx/sites-available/linkhub   (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# Replace links.yourdomain.com. Get HTTPS with:  sudo certbot --nginx -d links.yourdomain.com
#
# Nginx is your DDoS / abuse shield: it is far cheaper per request than Node, so floods, slow
# connections and password-guessing are cut off here before they reach the app.
# The numbers are generous for real visitors (a conference-centre Wi-Fi can put hundreds of people
# behind one IP) but stop a single machine from hammering you.

# ---- limits (these two files-level directives must live in the http{} context; sites-enabled is included there) ----
limit_req_zone  $binary_remote_addr zone=lh_general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=lh_login:10m   rate=6r/m;     # sign-in + 2FA code endpoints
limit_conn_zone $binary_remote_addr zone=lh_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name links.yourdomain.com;

    # ---- don't advertise the version; refuse odd methods -------------------------------------
    server_tokens off;
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) { return 405; }

    # ---- slow-connection (Slowloris) + body limits ------------------------------------------
    client_header_timeout   10s;
    client_body_timeout     15s;
    send_timeout            20s;
    keepalive_timeout       15s;
    client_max_body_size    6m;           # logo / cover uploads are capped at 5 MB by the app
    client_body_buffer_size 32k;
    large_client_header_buffers 4 8k;

    # ---- per-address limits -------------------------------------------------------------------
    limit_conn         lh_conn 40;        # at most 40 simultaneous connections per IP
    limit_req          zone=lh_general burst=80 nodelay;
    limit_req_status   429;
    limit_conn_status  429;

    # never serve hidden files (but leave Let's Encrypt's challenge path alone)
    location ~ /\.(?!well-known) { deny all; return 404; }

    # sign-in and second-factor endpoints: a human needs a handful per minute
    location ~ ^/api/auth/(login|2fa/verify)$ {
        limit_req zone=lh_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/linkhub-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/linkhub-proxy.conf;
    }

    # ---- OPTIONAL but recommended: let Nginx serve the static files itself ------------------
    # Static requests then never touch Node, which matters most during a flood. Adjust the paths, and make sure the
    # nginx user (www-data) can read them (e.g. add it to the group that owns the folder).
    #
    # location /assets/ {
    #     alias /var/www/linkhub/client/dist/assets/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    # location /uploads/ {
    #     alias /var/www/linkhub/server/data/uploads/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #     add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    #     add_header X-Content-Type-Options nosniff always;
    # }
}

# After `certbot --nginx` adds the HTTPS server block, make sure that block also has:
#     server_tokens off;   (and the same client_* timeouts, limit_conn / limit_req lines and location blocks as above)
#     ssl_protocols TLSv1.2 TLSv1.3;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Behind Cloudflare? Nginx then sees Cloudflare's address for every visitor, which breaks per-IP limits.
# Restore the real address (list of ranges: https://www.cloudflare.com/ips/ - keep it updated):
#     set_real_ip_from 173.245.48.0/20;   # ...one line per Cloudflare range, IPv4 and IPv6
#     real_ip_header   CF-Connecting-IP;
# and then only accept web traffic from Cloudflare's ranges at the firewall (see SECURITY.md).
